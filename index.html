<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Aplikasi pencatatan penjualan dan pengeluaran kedai harian dengan fitur PWA, Auto-Save, dan integrasi WhatsApp.">
    <title>Laporan Penjualan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Laporan Harian</h1>
                <div class="header-actions">
                    <button class="btn-text" id="btn-history">Riwayat</button>
                    <button class="btn-text" id="btn-reset" style="color: var(--danger);">Reset</button>
                </div>
            </div>
            <input type="date" id="report-date" class="input-base" aria-label="Pilih tanggal laporan">
        </header>

        <main>
            <!-- Penjualan Section -->
            <section class="section-block">
                <div class="section-header">
                    <h2>Penjualan</h2>
                    <button class="btn-text" id="add-sale">+ Tambah</button>
                </div>
                <div class="list-container" id="sales-list">
                    <!-- Dynamic items -->
                </div>
            </section>

            <!-- Pengeluaran Section -->
            <section class="section-block">
                <div class="section-header">
                    <h2>Pengeluaran</h2>
                    <button class="btn-text" id="add-expense">+ Tambah</button>
                </div>
                <div class="list-container" id="expenses-list">
                    <!-- Dynamic items -->
                </div>
            </section>

            <!-- Actions -->
            <section class="action-section">
                <button class="btn-primary" id="generate-btn">Buat Laporan</button>
            </section>

            <!-- Output -->
            <section class="result-container hidden" id="result-container">
                <textarea id="report-output" readonly aria-label="Hasil Laporan Teks"></textarea>
                <div class="result-actions">
                    <button class="btn-secondary" id="copy-btn">Salin</button>
                    <button class="btn-success" id="wa-btn">Kirim WhatsApp</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal History -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Riwayat Laporan</h2>
                <button id="close-history" class="btn-close" aria-label="Tutup riwayat">✕</button>
            </div>
            <div id="history-list" class="history-list">
                <!-- History items -->
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
